[package]
name = "pi-webcam-streamer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
axum = "0.8.8"
futures = "0.3.31"
image = "0.25.9"
nokhwa = { version = "0.10.10", features = ["input-native", "output-threaded"] }
tokio = { version = "1.49.0", features = ["full"] }
tokio-stream = { version = "0.1.18", features = ["net", "sync"] }
tower-http = { version = "0.6.8", features = ["fs"] }
chrono = "0.4"
config = "0.15.19"
serde = { version = "1.0.228", features = ["derive"] }
clap = { version = "4.5.56", features = ["derive"] }
libc = "0.2.180"

[dev-dependencies]
tempfile = "3.16.0"
filetime = "0.2.25"
