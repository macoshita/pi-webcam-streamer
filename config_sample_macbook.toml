# Camera Settings
camera_index = 0          # e.g., /dev/video0 or 0
camera_width = 640           # Output video width
camera_height = 480          # Output video height
camera_fps = 30           # Frame rate
camera_format = "YUYV"

# Server Settings
port = 8080               # Web server port

# Recording Settings (Optional)
# If recording_path is set, background recording is enabled.
# Note: Continuous recording writes a large amount of data. Writing directly to the SD card may cause it to wear out quickly and fail.
# We strongly recommend using an external USB drive (HDD/SSD) or a RAM disk for the recording path.
recording_path = "/tmp/recordings"
# recording_segment_seconds = 10 # Duration of each video segment in seconds
# recording_video_codec = "libx264" # Video codec for recording, e.g., libx264, h264_v4l2m2m (for RPi hardware acceleration)
recording_retention = "12h" # Retention duration for recordings, e.g. "12h", "1day", "7days 12h"
