name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: frontend
        run: bun install

      - name: Build frontend
        working-directory: frontend
        run: bun run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build

  build-backend:
    needs: build-frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive_name: pi-webcam-streamer-linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive_name: pi-webcam-streamer-linux-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Handle v4l (video4linux) dependencies for cross-compilation if necessary.
      # cargo-zigbuild usually handles libc nicely, but C libraries might need sysroot.
      # For now, we assume pure Rust or minimal C deps that zigbuild can handle or are statically linked.
      # If v4l-sys fails, we might need 'cross'. Sticking to zigbuild for speed as per plan.

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild

      - name: download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/build

      - name: Build
        run: cargo zigbuild --target ${{ matrix.target }} --release

      - name: Create Release Package
        run: |
          mkdir -p release_pkg/${{ matrix.archive_name }}
          cp target/${{ matrix.target }}/release/pi-webcam-streamer release_pkg/${{ matrix.archive_name }}/
          cp config_sample_macbook.toml release_pkg/${{ matrix.archive_name }}/config.toml
          mkdir -p release_pkg/${{ matrix.archive_name }}/frontend
          cp -r frontend/build release_pkg/${{ matrix.archive_name }}/frontend/

      - name: Archive
        working-directory: release_pkg
        run: tar -czf ../${{ matrix.archive_name }}.tgz ${{ matrix.archive_name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.archive_name }}.tgz
